version: '3.8'
services:
  mongo:
    image: mongo:5.0
    container_name: gaurb1-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-db:/data/db
    networks:
      - app-network

  boot-app:
    image: gaurb1/boot-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
        - MONGO_URI=mongodb://mongo:27018/chat-app
    depends_on:
      - mongo
    networks:
        - app-network



volumes:
  mongo-db:

networks:
  app-network:
