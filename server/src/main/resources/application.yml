spring:
  application:
    name: chat-app-backend
  data:
    mongodb:
      uri: ${MONGODB_URL}
      database: ${DATABASE_NAME}

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ./uploads/avatars

logging:
  level:
    org:
      springframework:
        web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

chatapp:
  perplexity:
    api-key: ${PERPLEXITY_API_KEY}