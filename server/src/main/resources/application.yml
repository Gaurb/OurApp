spring:
  application:
    name: chat-app-backend
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dummy-api-key}
        project-id: ${GOOGLE_CLOUD_PROJECT_ID:dummy-project-id}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash-lite}
        embedding:
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    vectorstore:
      mongodb:
        collection-name: vector_store
        index-name: vector_index
        path-name: embedding
  data:
    mongodb:
      uri: {MONGODB_URI:mongodb://localhost:27017/chat-app}
      database: ${MONGODB_DATABASE:chat-app}
      auto-index-creation: true

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  
  # Multipart properties
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# Swagger configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# File storage configuration
file:
  upload-dir: ./uploads/avatars
  # MongoDB connection properties
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/chat-app}
      database: ${MONGODB_DATABASE:chat-app}
      auto-index-creation: true

# Logging configuration
logging:
  level:
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
