name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug - Repository and directory structure
      run: |
        echo "=== Repository Information ==="
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "Working directory: $(pwd)"
        echo ""
        echo "=== Root directory contents ==="
        ls -la
        echo ""
        echo "=== Looking for Server/server directories ==="
        find . -maxdepth 2 -name "*erver*" -type d || echo "No Server/server directories found"
        echo ""
        echo "=== Looking for pom.xml files ==="
        find . -name "pom.xml" || echo "No pom.xml files found"
        echo ""
        echo "=== Complete directory tree (first 3 levels) ==="
        find . -maxdepth 3 -type d | head -20
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Check if Server directory exists and make Maven wrapper executable
      run: |
        if [ -d "Server" ]; then
          echo "Server directory found"
          cd Server
          if [ -f "mvnw" ]; then
            echo "Making mvnw executable"
            chmod +x mvnw
          else
            echo "mvnw not found in Server directory"
            ls -la
          fi
        else
          echo "Server directory not found. Available directories:"
          ls -la
          exit 1
        fi
    
    - name: Run tests
      run: |
        if [ -d "Server" ]; then
          cd Server
          if [ -f "mvnw" ]; then
            ./mvnw clean test
          else
            mvn clean test
          fi
        else
          echo "Server directory not found"
          exit 1
        fi
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
    
  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Build application
      run: |
        if [ -d "Server" ]; then
          cd Server
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          else
            mvn clean package -DskipTests
          fi
        else
          echo "Server directory not found"
          exit 1
        fi
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: jar-artifact
        path: Server/target/*.jar
